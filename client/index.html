<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1011" />
    <meta name="color-scheme" content="dark light" />
    
    <!-- Primary SEO Metadata -->
    <title>SolarGrid — Smart Solar Grid & Energy Optimization Platform</title>
    <meta
      name="description"
      content="SolarGrid is an intelligent operating layer for distributed solar performance, hospital-grade critical load preservation, and peer-to-peer clean energy microgrid sharing."
    />
    <meta
      name="keywords"
      content="SolarGrid, solar tracking, microgrid, renewable energy, energy management system, critical load preservation, smart grid, hospital EMS, P2P energy trading"
    />
    <meta name="author" content="SolarGrid Technologies · Smart India Hackathon & Indradhanu" />
    <meta name="application-name" content="SolarGrid" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SolarGrid" />
    <meta property="og:title" content="SolarGrid — Smart Solar Grid & Energy Optimization Platform" />
    <meta
      property="og:description"
      content="Operating layer for distributed solar performance, hospital critical load preservation, and peer-to-peer clean energy trading."
    />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SolarGrid — Smart Solar Grid & Energy Optimization Platform" />
    <meta
      name="twitter:description"
      content="Operating layer for distributed solar performance, hospital critical load preservation, and peer-to-peer clean energy trading."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Brand Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Pre-mount Theme Initialization (Prevent Theme Flash) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored ? stored : "light";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
